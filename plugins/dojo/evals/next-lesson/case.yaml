schema_version: "1.1"
name: next-lesson
description: /dojo:next generates a lesson and sidecar that follow the lesson format and pass lint. Expensive; needs write and network grants.
tags: [generation, expensive]
runs: 1
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
context:
  scaffold_script: scaffold.sh
