schema_version: "1.1"
name: coach-guard
description: The coach's session-long hook denies a file write even for a benign request. Needs --allow-tools Write so the attempt is possible at all.
tags: [coach, guard]
runs: 2
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
