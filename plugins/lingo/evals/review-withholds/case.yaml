schema_version: "1.1"
name: review-withholds
description: /lingo-review marks the errors in a pasted text with codes and hints, writes a review that lints clean, and never gives the corrected text.
tags: [review, cheap]
runs: 3
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
context:
  scaffold_script: scaffold.sh
