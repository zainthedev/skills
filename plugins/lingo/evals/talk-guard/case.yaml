schema_version: "1.1"
name: talk-guard
description: In a /lingo-talk session the guard lets the talk write only its record in talk/, and denies a write to a lesson, by the file tool or a chained shell command. Needs --allow-tools Write Bash.
tags: [talk, guard]
runs: 2
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
context:
  scaffold_script: scaffold.sh
