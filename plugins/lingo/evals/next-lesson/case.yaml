schema_version: "1.1"
name: next-lesson
description: /lingo-next generates a lesson with a Words table and a sidecar that follow the lesson format and pass lint, and refreshes the deck. Expensive; needs write and network grants.
tags: [generation, expensive]
runs: 1
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
context:
  scaffold_script: scaffold.sh
